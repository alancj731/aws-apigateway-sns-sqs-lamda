name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths: [orders-serverless/src/Orders.AppHost/orders.template.json]
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request a GitHub OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-serverless   # the backend lives in a subfolder of this repo
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Validate template
        run: aws cloudformation validate-template --template-body file://src/Orders.AppHost/orders.template.json

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --stack-name orders-prod \
            --template-file src/Orders.AppHost/orders.template.json \
            --no-fail-on-empty-changeset